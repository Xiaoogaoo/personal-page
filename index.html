<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页生成器</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a0e17;color:#e0e6f0;min-height:100vh}
    body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(0,180,255,.06) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(120,0,255,.06) 0%,transparent 50%);z-index:-1}
    .wrap{max-width:600px;margin:0 auto;padding:40px 20px}
    h1{text-align:center;font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,#fff,#00b4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{text-align:center;color:#6b7a90;font-size:.9rem;margin-bottom:12px}
    .capacity{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px 20px;margin-bottom:20px}
    .capacity-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.82rem}
    .capacity-label span:first-child{color:#6b7a90}
    .capacity-label .pct{font-weight:600;transition:color .3s}
    .capacity-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
    .capacity-fill{height:100%;border-radius:3px;transition:width .4s ease,background .4s ease;background:linear-gradient(90deg,#00b4ff,#7c3aed)}
    .capacity-tip{font-size:.75rem;color:#4a5568;margin-top:8px;line-height:1.5}
    .card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:28px;margin-bottom:20px}
    .card-title{font-size:1.05rem;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}
    .card-title::before{content:'';display:inline-block;width:3px;height:18px;background:linear-gradient(180deg,#00b4ff,#7c3aed);border-radius:2px}
    label{display:block;font-size:.82rem;color:#6b7a90;margin-bottom:6px}
    input,textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#e0e6f0;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .3s}
    input:focus,textarea:focus{border-color:rgba(0,180,255,.4)}
    textarea{resize:vertical;min-height:80px}
    .row{display:flex;gap:12px;margin-bottom:12px}
    .row>*{flex:1}
    .field{margin-bottom:14px}
    .char-count{font-size:.72rem;color:#4a5568;text-align:right;margin-top:2px}
    .hobby-item{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
    .hobby-item .row{margin-bottom:8px}
    .remove-hobby{position:absolute;top:10px;right:12px;background:none;border:none;color:#6b7a90;cursor:pointer;font-size:1.1rem}
    .remove-hobby:hover{color:#ff4444}
    .add-btn{background:none;border:1px dashed rgba(0,180,255,.2);color:#5a9fcf;padding:10px;border-radius:10px;width:100%;cursor:pointer;font-size:.85rem;transition:all .3s}
    .add-btn:hover{border-color:rgba(0,180,255,.4);background:rgba(0,180,255,.04)}
    .link-item,.media-item{display:flex;gap:10px;margin-bottom:10px;align-items:center}
    .link-item input,.media-item input{flex:1}
    .link-item select,.media-item select{width:120px;padding:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#e0e6f0;font-size:.85rem}
    .link-item select option,.media-item select option{background:#1a1f2e}
    .remove-btn{background:none;border:none;color:#6b7a90;cursor:pointer;font-size:1.1rem;flex-shrink:0}
    .remove-btn:hover{color:#ff4444}
    .gen-btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#00b4ff,#7c3aed);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .3s;margin-top:8px}
    .gen-btn:hover{opacity:.9}
    .gen-btn:disabled{opacity:.4;cursor:not-allowed}
    #result{display:none;margin-top:24px;text-align:center}
    .qr-img{border-radius:12px;background:#fff;padding:10px;margin:0 auto 16px;display:inline-block}
.qr-img img,.qr-img canvas{display:block}
    .share-url{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 14px;font-size:.78rem;color:#6b7a90;word-break:break-all;margin-bottom:12px;text-align:left;max-height:60px;overflow-y:auto}
    .copy-btn,.preview-btn{display:inline-block;padding:10px 24px;border-radius:8px;font-size:.88rem;cursor:pointer;transition:all .3s;margin:4px}
    .copy-btn{background:rgba(0,180,255,.1);border:1px solid rgba(0,180,255,.2);color:#5a9fcf}
    .copy-btn:hover{background:rgba(0,180,255,.2)}
    .preview-btn{background:rgba(120,0,255,.1);border:1px solid rgba(120,0,255,.2);color:#a78bfa}
    .preview-btn:hover{background:rgba(120,0,255,.2)}
    .tip{font-size:.75rem;color:#4a5568;margin-top:4px;line-height:1.5}
    @media(max-width:500px){.row,.link-item,.media-item,.hobby-item .row{flex-direction:column}.wrap{padding:24px 14px}h1{font-size:1.5rem}.link-item select,.media-item select{width:100%}}
  </style>
</head>
<body>

<div class="wrap">
  <h1>个人主页生成器</h1>
  <p class="sub">填写资料，一键生成专属个人主页与二维码</p>

  <!-- 容量指示器 -->
  <div class="capacity">
    <div class="capacity-label">
      <span>已用容量</span>
      <span class="pct" id="cap-pct">0%</span>
    </div>
    <div class="capacity-bar"><div class="capacity-fill" id="cap-fill" style="width:0%"></div></div>
    <div class="capacity-tip" id="cap-tip">剩余充足，可放心填写</div>
  </div>

  <!-- 基本信息 -->
  <div class="card">
    <div class="card-title">基本信息</div>
    <div class="field"><label>姓名 *</label><input id="name" placeholder="你的名字" maxlength="20" oninput="updateCap()"></div>
    <div class="row">
      <div class="field"><label>学校</label><input id="school" placeholder="所在学校" maxlength="20" oninput="updateCap()"></div>
      <div class="field"><label>专业</label><input id="major" placeholder="所学专业" maxlength="20" oninput="updateCap()"></div>
    </div>
    <div class="field"><label>个人标语</label><input id="tagline" placeholder="一句话介绍自己" maxlength="30" oninput="updateCap()"></div>
    <div class="field"><label>头像背景色</label><input id="color" placeholder="如 #00b4ff 或留空随机生成" maxlength="7" oninput="updateCap()"></div>
  </div>

  <!-- 关于我 -->
  <div class="card">
    <div class="card-title">关于我</div>
    <div class="field">
      <label>自我介绍</label>
      <textarea id="intro" placeholder="简单介绍一下自己..." rows="4" maxlength="500" oninput="updateCap()"></textarea>
      <div class="char-count" id="intro-count">0 / 500</div>
    </div>
  </div>

  <!-- 兴趣爱好 -->
  <div class="card">
    <div class="card-title">兴趣爱好</div>
    <div id="hobbies-list"></div>
    <button class="add-btn" onclick="addHobby()">+ 添加兴趣爱好</button>
  </div>

  <!-- 联系方式 -->
  <div class="card">
    <div class="card-title">联系方式</div>
    <div class="field">
      <label>社交链接</label>
      <div id="links-list"></div>
      <button class="add-btn" onclick="addLink()">+ 添加链接</button>
    </div>
  </div>

  <!-- 多媒体内容 -->
  <div class="card">
    <div class="card-title">多媒体内容</div>
    <p class="tip">粘贴图片、视频、音频的链接，展示在你的个人主页上。<br>图片推荐：微博、小红书、imgbb.com 等图床链接<br>视频推荐：Bilibili、抖音、YouTube 等分享链接<br>音频推荐：网易云音乐、QQ音乐等分享链接</p>
    <div class="field" style="margin-top:14px">
      <div id="media-list"></div>
      <button class="add-btn" onclick="addMedia()">+ 添加多媒体链接</button>
    </div>
  </div>

  <button class="gen-btn" id="gen-btn" onclick="generate()">生成我的个人主页</button>

  <div id="result">
    <p style="color:#5a9fcf;margin-bottom:14px;font-size:.92rem">生成成功！扫码或复制链接分享给好友</p>
    <div id="qr-box" class="qr-img"></div>
    <div class="share-url" id="share-url"></div>
    <button class="copy-btn" onclick="copyUrl()">复制链接</button>
    <button class="preview-btn" onclick="preview()">预览效果</button>
  </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const MAX_URL = 2800;
const BASE_URL_LEN = 60;
// ★ 改成你的 GitHub Pages 地址，例如 https://gzy.github.io/repo-name/
const SITE_BASE = '';
let hobbyCount = 0;
let linkCount = 0;
let mediaCount = 0;

// 估算当前数据编码后的长度
function estimateLength() {
  return encode(collect()).length;
}

// 更新容量指示器
function updateCap() {
  const len = estimateLength();
  const pct = Math.min(100, Math.round(len / MAX_URL * 100));
  const fill = document.getElementById('cap-fill');
  const pctEl = document.getElementById('cap-pct');
  const tip = document.getElementById('cap-tip');
  const genBtn = document.getElementById('gen-btn');

  fill.style.width = pct + '%';
  pctEl.textContent = pct + '%';

  const introLen = document.getElementById('intro').value.length;
  document.getElementById('intro-count').textContent = introLen + ' / 500';

  if (pct >= 95) {
    fill.style.background = '#ff4444'; pctEl.style.color = '#ff4444';
    tip.textContent = '容量即将用尽，请精简内容';
    genBtn.disabled = true;
  } else if (pct >= 75) {
    fill.style.background = 'linear-gradient(90deg,#ff9800,#ff5722)'; pctEl.style.color = '#ff9800';
    tip.textContent = '容量紧张，建议精简部分内容';
    genBtn.disabled = false;
  } else {
    fill.style.background = 'linear-gradient(90deg,#00b4ff,#7c3aed)'; pctEl.style.color = '#5a9fcf';
    tip.textContent = '剩余充足，可放心填写';
    genBtn.disabled = false;
  }
}

// 添加兴趣爱好
function addHobby() {
  const icons = [' ',' ',' ',' ',' ',' ',' ',' ',' ',' '];
  const idx = hobbyCount % icons.length;
  const html = `<div class="hobby-item" id="hobby-${hobbyCount}">
    <button class="remove-hobby" onclick="this.parentElement.remove();updateCap()">&times;</button>
    <div class="row">
      <div class="field" style="margin:0"><label>名称</label><input class="h-name" placeholder="如：乒乓球" maxlength="10" oninput="updateCap()"></div>
      <div class="field" style="margin:0"><label>图标</label><input class="h-icon" value="${icons[idx]}" style="width:60px;text-align:center;font-size:1.2rem" oninput="updateCap()"></div>
    </div>
    <div class="field" style="margin:0"><label>描述</label><input class="h-desc" placeholder="一句话描述" maxlength="30" oninput="updateCap()"></div>
  </div>`;
  document.getElementById('hobbies-list').insertAdjacentHTML('beforeend', html);
  hobbyCount++;
  updateCap();
}

// 添加链接
function addLink() {
  const html = `<div class="link-item" id="link-${linkCount}">
    <select class="l-type" onchange="updateCap()"><option value="邮箱">邮箱</option><option value="微信">微信</option><option value="QQ">QQ</option><option value="GitHub">GitHub</option><option value="Bilibili">Bilibili</option><option value="抖音">抖音</option><option value="小红书">小红书</option><option value="其他">其他</option></select>
    <input class="l-url" placeholder="链接地址或账号" maxlength="120" oninput="updateCap()">
    <button class="remove-btn" onclick="this.parentElement.remove();updateCap()">&times;</button>
  </div>`;
  document.getElementById('links-list').insertAdjacentHTML('beforeend', html);
  linkCount++;
  updateCap();
}

// 添加多媒体链接
function addMedia() {
  const html = `<div class="media-item" id="media-${mediaCount}">
    <select class="m-type" onchange="updateCap()"><option value="img">图片</option><option value="video">视频</option><option value="audio">音频</option><option value="link">其他链接</option></select>
    <input class="m-url" placeholder="粘贴链接地址" maxlength="200" oninput="updateCap()">
    <input class="m-title" placeholder="标题（可选）" maxlength="20" oninput="updateCap()" style="max-width:120px">
    <button class="remove-btn" onclick="this.parentElement.remove();updateCap()">&times;</button>
  </div>`;
  document.getElementById('media-list').insertAdjacentHTML('beforeend', html);
  mediaCount++;
  updateCap();
}

// 收集数据
function collect() {
  const hobbies = [];
  document.querySelectorAll('.hobby-item').forEach(el => {
    const name = el.querySelector('.h-name').value.trim();
    if (name) hobbies.push({
      name, icon: el.querySelector('.h-icon').value.trim(), desc: el.querySelector('.h-desc').value.trim()
    });
  });

  const links = [];
  document.querySelectorAll('.link-item').forEach(el => {
    const url = el.querySelector('.l-url').value.trim();
    if (url) links.push({
      text: el.querySelector('.l-type').value,
      url: url.startsWith('http') || url.startsWith('mailto:') ? url : (url.includes('@') ? 'mailto:' + url : url)
    });
  });

  const media = [];
  document.querySelectorAll('.media-item').forEach(el => {
    const url = el.querySelector('.m-url').value.trim();
    if (url) media.push({
      type: el.querySelector('.m-type').value,
      url,
      title: el.querySelector('.m-title').value.trim()
    });
  });

  const tags = [];
  const school = document.getElementById('school').value.trim();
  const major = document.getElementById('major').value.trim();
  if (school) tags.push(school);
  if (major) tags.push(major);

  return {
    name: document.getElementById('name').value.trim(),
    tagline: document.getElementById('tagline').value.trim(),
    color: document.getElementById('color').value.trim(),
    tags, intro: document.getElementById('intro').value.trim(),
    hobbies, links, media
  };
}

// 编码
function encode(data) {
  const json = JSON.stringify(data);
  return btoa(unescape(encodeURIComponent(json)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// 生成
function generate() {
  const data = collect();
  if (!data.name) { alert('请填写姓名'); return; }

  const encoded = encode(data);
  const base = SITE_BASE || location.href.replace(/index\.html$/, '').replace(/#.*$/, '');
  const url = base + 'profile.html#' + encoded;

  const box = document.getElementById('qr-box');
  box.innerHTML = '';
  new QRCode(box, {
    text: url, width: 200, height: 200,
    colorDark: '#0a0e17', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  document.getElementById('share-url').textContent = url;
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

// 复制链接
function copyUrl() {
  const url = document.getElementById('share-url').textContent;
  navigator.clipboard.writeText(url).then(() => {
    document.querySelector('.copy-btn').textContent = '已复制!';
    setTimeout(() => document.querySelector('.copy-btn').textContent = '复制链接', 1500);
  });
}

// 预览
function preview() {
  window.open(document.getElementById('share-url').textContent, '_blank');
}

// 初始化
addHobby();
addHobby();
addLink();
</script>
</body>
</html>
